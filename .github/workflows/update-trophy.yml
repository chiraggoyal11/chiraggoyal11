name: Update GitHub Trophy

on:
  push:
    paths:
      - '.github/workflows/update-trophy.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=flat&column=6&margin-w=10&no-bg=true&no-frame=true'
          path: .github/assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated trophy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/assets/github-trophy.svg
          git diff --cached --quiet || git commit -m 'chore: update GitHub achievements'
          git push
